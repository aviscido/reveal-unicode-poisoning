<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2233"/>
      <stop offset="1" stop-color="#0D111B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- text lines -->
  <g fill="#48566E">
    <rect x="20" y="30" width="52" height="8" rx="4"/>
    <rect x="20" y="60" width="26" height="8" rx="4"/>
    <rect x="20" y="90" width="66" height="8" rx="4"/>
    <rect x="94" y="90" width="14" height="8" rx="4"/>
  </g>

  <!-- the hidden character, revealed -->
  <rect x="54" y="52" width="24" height="24" rx="5" fill="none" stroke="#EF4444" stroke-width="5" stroke-dasharray="7 5"/>

  <!-- magnifier -->
  <g stroke="#38BDF8" stroke-width="9" fill="none" stroke-linecap="round">
    <circle cx="66" cy="64" r="34"/>
    <path d="M91 89 L110 108"/>
  </g>
</svg>
